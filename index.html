<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ぐるぐる音読">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FBF6EA">
<meta name="format-detection" content="telephone=no">
<title>ぐるぐる音読</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* ぐるぐる音読 — プリント風（方眼の紙・朱の答え・はなまる）＋線路と駅。DESIGN §10 / D-45 */
:root {
  --paper: #FBF6EA; --paper-2: #F3EBD8; --sheet: #FFFDF7;
  --ink: #1E2638; --ink-2: #5B6275; --line: #D9CFB8; --grid: #EDE4CF;
  --rail: #2F6B4F; --rail-d: #1F4B37; --signal: #F2B705;
  --answer: #C8431C; --weak: #C2410C; --gold: #C99A1E; --known: #8E978E;
  --round: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "BIZ UDPGothic", "Yu Gothic UI", sans-serif;
  --ud: "BIZ UDPGothic", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #161A20; --paper-2: #1F242C; --sheet: #1B2027;
    --ink: #EDE6D6; --ink-2: #A9AFBB; --line: #3A4150; --grid: #20262E;
    --rail: #4E9A75; --rail-d: #2F6B4F; --answer: #FF8A5C; --weak: #FF9A62; --known: #6F786F;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #161A20; --paper-2: #1F242C; --sheet: #1B2027;
  --ink: #EDE6D6; --ink-2: #A9AFBB; --line: #3A4150; --grid: #20262E;
  --rail: #4E9A75; --rail-d: #2F6B4F; --answer: #FF8A5C; --weak: #FF9A62; --known: #6F786F;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100dvh; color: var(--ink); font-family: var(--ud); font-size: 18px; line-height: 1.6;
  background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px; background-position: -1px -1px;
  touch-action: manipulation; -webkit-tap-highlight-color: transparent;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3 { font-family: var(--round); font-weight: 900; line-height: 1.3; margin: 0; }
ruby rt { font-family: var(--ud); font-weight: 400; ruby-align: center; }
:focus-visible { outline: 3px solid var(--signal); outline-offset: 2px; }
.muted { color: var(--ink-2); }

#app { max-width: 760px; margin: 0 auto; padding: max(12px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); min-height: 100dvh; display: flex; flex-direction: column; }

/* ---- ボタン ---- */
.btn-main, .btn-sub, .btn-next, .mode-btn, .tile, .pickitem, .seg button, .tabs button {
  border-radius: 12px; border: 2px solid var(--ink); background: var(--sheet); color: var(--ink);
  box-shadow: 0 4px 0 var(--ink); transition: transform .06s, box-shadow .06s;
}
.btn-main:active, .btn-sub:active, .mode-btn:active, .tile:active, .pickitem:active, .btn-next.down { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.btn-main {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  width: 100%; min-height: 96px; padding: 12px 16px; font-family: var(--round); font-weight: 900; font-size: 26px;
  background: var(--rail); color: #fff; border-color: var(--rail-d); box-shadow: 0 5px 0 var(--rail-d);
}
.btn-main:active { box-shadow: 0 2px 0 var(--rail-d); }
.btn-main small, .btn-sub small { font-family: var(--ud); font-weight: 400; font-size: 15px; opacity: .92; }
.btn-quiet { background: var(--sheet); color: var(--rail); border-color: var(--rail); box-shadow: 0 5px 0 var(--rail); }
.btn-sub {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  width: 100%; min-height: 64px; padding: 8px 12px; font-family: var(--round); font-weight: 700; font-size: 20px;
}
.btn-sub.warn { color: var(--answer); border-color: var(--answer); box-shadow: 0 4px 0 var(--answer); }
.btn-sub.file { position: relative; overflow: hidden; }
.btn-sub.file input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.actions { display: grid; gap: 14px; margin-top: auto; padding-top: 20px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.row2:has(> :only-child) { grid-template-columns: 1fr; }

/* ---- ホーム ---- */
.top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 4px 0 12px; border-bottom: 2px solid var(--ink); }
.brand { font-size: 30px; letter-spacing: .04em; }
.brand::before { content: ""; display: inline-block; width: .9em; height: .9em; margin-right: .3em; vertical-align: -.08em; border: 4px solid var(--rail); border-radius: 50%; border-right-color: var(--signal); }
.dspick { display: flex; flex-direction: column; align-items: flex-start; gap: 0; margin-top: 6px; padding: 6px 10px; min-height: 64px; border: 2px dashed var(--ink-2); border-radius: 10px; background: transparent; text-align: left; }
.dst { font-family: var(--round); font-weight: 900; font-size: 19px; }
.dsk { font-size: 13px; color: var(--ink-2); }
.dspick .chg { font-size: 14px; color: var(--rail); font-weight: 700; }
.parent { position: relative; min-width: 64px; min-height: 64px; padding: 6px 8px; border: 1.5px solid var(--line); border-radius: 10px; background: transparent; color: var(--ink-2); font-size: 13px; line-height: 1.2; overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.parent i { position: absolute; left: 0; bottom: 0; height: 4px; width: 0; background: var(--rail); }
.parent.holding i { width: 100%; transition: width 2s linear; }
.home { display: flex; flex-direction: column; flex: 1; padding-top: 16px; }
.hero { padding: 24px 0 8px; }
.lead { font-family: var(--round); font-weight: 700; font-size: 24px; margin: 0 0 20px; }
.sample { background: var(--sheet); border: 2px solid var(--ink); border-radius: 8px; padding: 14px 12px; font-size: 22px; line-height: 2.1; text-align: center; }
.sample.big { font-size: 26px; }
.daynote { font-family: var(--round); font-weight: 700; font-size: 22px; text-align: center; margin: 14px 0 8px; }
.mini { margin: 0; display: grid; gap: 0; background: var(--sheet); border: 2px solid var(--ink); border-radius: 8px; }
.mini div { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 14px; border-top: 1px dashed var(--line); }
.mini div:first-child { border-top: 0; }
.mini dt { color: var(--ink-2); font-size: 15px; }
.mini dd { margin: 0; font-family: var(--round); font-weight: 700; font-size: 19px; text-align: right; }
.tag { display: inline-block; font-size: 13px; padding: 0 6px; border: 1.5px solid var(--ink-2); border-radius: 4px; color: var(--ink-2); vertical-align: 2px; }
.tag-off { border-color: var(--answer); color: var(--answer); }
.clear { margin-top: 16px; background: var(--sheet); border: 2px solid var(--ink); border-radius: 8px; padding: 16px; text-align: center; }
.clear h2 { font-size: 28px; color: var(--answer); }
.reward { font-size: 20px; }

/* 7日の線路（B） */
.rail { list-style: none; display: grid; grid-template-columns: repeat(7, 1fr); margin: 18px 0 0; padding: 0; position: relative; }
.rail::before { content: ""; position: absolute; left: 7%; right: 7%; top: 21px; height: 6px; background: repeating-linear-gradient(90deg, var(--ink) 0 10px, transparent 10px 16px); opacity: .25; }
.st { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.st .dot { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: var(--sheet); border: 2.5px solid var(--line); font-family: var(--round); font-weight: 700; color: var(--ink-2); font-size: 16px; }
.st.prac .dot { border-color: var(--rail); background: var(--rail); color: #fff; }
.st.off .dot { border-color: var(--answer); color: var(--answer); background: var(--sheet); }
.st.now .dot { border-color: var(--signal); box-shadow: 0 0 0 4px color-mix(in srgb, var(--signal) 35%, transparent); }
.st .lbl { font-size: 12px; color: var(--ink-2); min-height: 1.2em; }
.hanamaru { width: 38px; height: 38px; color: var(--answer); }
.hanamaru.big { width: 76px; height: 76px; }

/* ---- 共通の見出し・中央寄せ ---- */
.bar { padding: 6px 0 12px; border-bottom: 2px solid var(--ink); margin-bottom: 12px; }
.bar h2 { font-size: 26px; }
.hint { color: var(--ink-2); font-size: 16px; margin: 6px 0 0; }
.dock { position: sticky; bottom: 0; padding: 14px 0 max(4px, env(safe-area-inset-bottom)); background: linear-gradient(transparent, var(--paper) 30%); margin-top: auto; }
.center { flex: 1; display: flex; flex-direction: column; justify-content: center; text-align: center; gap: 12px; padding: 16px 0; }
.center h2 { font-size: 28px; }
.center p { font-size: 19px; margin: 0; }
.center .actions { margin-top: 12px; }
.step { color: var(--ink-2); font-size: 15px !important; }
.tagline { font-family: var(--round); font-weight: 700; color: var(--answer); }
.fake-btn { margin: 12px auto; max-width: 320px; padding: 18px; border-radius: 12px; background: var(--rail); color: #fff; font-family: var(--round); font-weight: 900; font-size: 22px; box-shadow: 0 5px 0 var(--rail-d); }

/* ---- 札（言えるチェック・にがて） ---- */
.check h3, .table h3, .cands h3 { font-size: 18px; margin: 16px 0 8px; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.check h3 small, .table h3 small, .cands h3 small { font-family: var(--ud); font-weight: 400; font-size: 14px; color: var(--ink-2); }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.tile { position: relative; min-height: 96px; padding: 10px 8px 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-align: center; box-shadow: 0 3px 0 var(--ink); }
.tile .q { font-size: 20px; font-weight: 700; line-height: 1.9; }
.tile .a { font-size: 18px; line-height: 1.9; color: var(--answer); font-weight: 700; }
.tile:not(.known):not(.notyet):not(.flip):not(.weakt) .a { color: var(--ink-2); font-size: 22px; }
.tile.flip { border-style: dashed; cursor: default; }
.tile .yn { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; width: 100%; margin-top: 4px; }
.tile .yn button { min-height: 56px; border-radius: 8px; border: 2px solid var(--ink); background: var(--sheet); font-family: var(--round); font-weight: 900; font-size: 17px; }
.tile .yn .yes { background: var(--rail); border-color: var(--rail-d); color: #fff; }
.tile.known { background: color-mix(in srgb, var(--rail) 12%, var(--sheet)); border-color: var(--rail); box-shadow: 0 3px 0 var(--rail); }
.tile.notyet { border-color: var(--answer); box-shadow: 0 3px 0 var(--answer); }
.tile i { position: absolute; top: 4px; right: 6px; font-style: normal; font-size: 13px; font-weight: 700; }
.tile i.ok { color: var(--rail); }
.tile i.ny { color: var(--answer); }
.tile.weakt.on { border-color: var(--weak); box-shadow: 0 3px 0 var(--weak); background: color-mix(in srgb, var(--weak) 9%, var(--sheet)); }
.tile i.star, i.star { color: var(--weak); font-size: 18px; font-style: normal; }

/* ---- モード ---- */
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 8px; }
.mode-btn { position: relative; min-height: 132px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 12px; }
.mode-btn b { font-family: var(--round); font-weight: 900; font-size: 26px; }
.mode-btn small { color: var(--ink-2); font-size: 15px; }
.mode-btn.rec { border-color: var(--answer); box-shadow: 0 4px 0 var(--answer); }
.mode-btn i { position: absolute; top: -12px; right: 10px; font-style: normal; background: var(--answer); color: #fff; font-size: 14px; font-weight: 700; padding: 2px 10px; border-radius: 99px; }
.count .num { font-family: var(--round); font-weight: 900; font-size: 160px; line-height: 1; color: var(--rail); }

/* ---- 10分の音読 ---- */
#app.screen-run { height: 100dvh; min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 8px; padding-bottom: max(10px, env(safe-area-inset-bottom)); overflow: hidden; }
.runhead { display: grid; grid-template-columns: 1fr auto auto; grid-template-areas: "clock chip pause" "loop loop lap"; align-items: center; gap: 4px 10px; padding-bottom: 6px; border-bottom: 2px solid var(--ink); }
.clock { grid-area: clock; display: flex; align-items: baseline; gap: 6px; }
.clock small { font-size: 14px; color: var(--ink-2); }
.clock span { font-family: var(--round); font-weight: 900; font-size: 40px; font-variant-numeric: tabular-nums; letter-spacing: .02em; line-height: 1.1; }
.modechip { grid-area: chip; justify-self: start; font-size: 14px; font-weight: 700; padding: 2px 10px; border: 2px solid var(--rail); color: var(--rail); border-radius: 99px; }
.modechip.hide { border-color: var(--answer); color: var(--answer); }
.pause { grid-area: pause; width: 64px; height: 64px; border-radius: 12px; border: 2px solid var(--ink); background: var(--sheet); font-family: var(--round); font-weight: 900; font-size: 24px; box-shadow: 0 3px 0 var(--ink); }
.loop { grid-area: loop; list-style: none; display: flex; align-items: center; margin: 0; padding: 0; }
.loop li { flex: 0 0 auto; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; border: 2.5px solid var(--line); background: var(--sheet); font-weight: 700; font-size: 14px; color: var(--ink-2); position: relative; }
.loop li + li { margin-left: 22px; }
.loop li + li::before { content: ""; position: absolute; right: 100%; width: 22px; height: 4px; background: var(--line); margin-right: 2px; }
.loop li.done { background: var(--rail); border-color: var(--rail); color: #fff; }
.loop li.done + li::before, .loop li.done + li.done::before { background: var(--rail); }
.loop li.here { background: var(--signal); border-color: var(--ink); color: var(--ink); transform: scale(1.12); }
.runhead > * { min-width: 0; }
.loop.many li { width: 24px; height: 24px; font-size: 12px; }   /* 駅が6つ以上（1行5ペアの表）は 小さく。D-79 */
.loop.many li + li { margin-left: 10px; }
.loop.many li + li::before { width: 10px; }
.lapno { grid-area: lap; margin: 0; font-family: var(--round); font-weight: 700; font-size: 16px; white-space: nowrap; }
.lapno b { font-size: 26px; color: var(--rail); }
.lapno.pop b { display: inline-block; animation: pop .5s ease-out; }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.8); color: var(--answer); } 100% { transform: scale(1); } }

.runrow { --fs: 28px; --rt: 13px; position: relative; min-height: 0; overflow: hidden; display: flex; flex-direction: column; background: var(--sheet); border: 2px solid var(--ink); border-radius: 8px; padding: 6px 12px 4px; }
.rowhead { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1.5px solid var(--ink); padding-bottom: 2px; }
.rowhead h2 { font-size: 20px; }
.rowhead h2 small { font-family: var(--ud); font-weight: 400; font-size: 13px; color: var(--ink-2); }
.rowclock { font-size: 14px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.ghost { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); margin: 0 0 3px; }
.ghost .gtrack { position: relative; height: 12px; border-bottom: 2px dashed var(--line); }
.ghost #gtrain { position: absolute; left: 0; bottom: -3px; width: 22px; height: 11px; margin-left: -11px; border-radius: 4px 6px 2px 2px; background: var(--rail); opacity: .55; transition: left .2s linear; }
.ghost #gtrain::after { content: ''; position: absolute; left: 4px; top: 2px; width: 10px; height: 3px; border-radius: 1px; background: var(--sheet); }
.ghost.goal { color: var(--answer); }
.ghost.goal .gl::after { content: '　ゴール！'; }
.ghost .gt { font-variant-numeric: tabular-nums; }
.pairs { list-style: none; margin: 0; padding: 0; flex: 1; overflow-y: auto; overscroll-behavior: contain; display: flex; flex-direction: column; justify-content: space-evenly; counter-reset: p; }
.pairs li { display: grid; grid-template-columns: 1.4em auto auto auto 1fr; align-items: end; column-gap: .2em; font-size: var(--fs); line-height: 1.15; padding: 2px 0; border-bottom: 1px dashed var(--line); counter-increment: p; }
.pairs li::before { content: counter(p); font-size: 13px; color: var(--ink-2); align-self: center; font-family: var(--round); }
.pairs li:last-child { border-bottom: 0; }
.pairs rt { font-size: var(--rt); line-height: 1.2; }
.pairs .q { font-weight: 700; }
.pairs .sep { color: var(--ink-2); }
.pairs .a { color: var(--answer); font-weight: 700; }
.pairs .times { justify-self: end; align-self: center; font-size: 15px; font-weight: 700; color: var(--ink-2); border: 1.5px solid var(--line); border-radius: 6px; padding: 0 6px; white-space: nowrap; }
.pairs li.weak .times { color: var(--weak); border-color: var(--weak); }
.pairs li.weak .times i { font-style: normal; }
.pairs.stack li { grid-template-columns: 1.4em 1fr auto; grid-template-areas: "n q t" "n a a"; row-gap: 0; align-items: center; }
.pairs.stack li::before { grid-area: n; }
.pairs.stack .q { grid-area: q; }
.pairs.stack .a { grid-area: a; padding-left: 1em; }
.pairs.stack .sep { display: none; }
.pairs.stack .times { grid-area: t; }
button.a.cover { font: inherit; font-weight: 700; padding: 0 4px; margin: 0; border: 0; border-radius: 6px; min-width: 4em; background: repeating-linear-gradient(-45deg, var(--paper-2) 0 6px, var(--line) 6px 8px); color: transparent; position: relative; min-height: max(32px, calc(var(--fs) * 1.5)); text-align: left; }
.pairs.stack button.a.cover { min-height: max(28px, calc(var(--fs) * 1.6)); }
.pairs.hidemode button.a.cover { width: 3.5em; white-space: nowrap; overflow: hidden; z-index: 1; }
.pairs.stack button.a.cover:not(.peek) rt { display: none; }
button.a.cover rt { color: transparent; }
button.a.cover::after { content: "？"; position: absolute; inset: 0; display: grid; place-items: center; color: var(--ink-2); font-size: .8em; }
button.a.cover.peek { outline: 2px solid var(--answer); }
.peekpop { position: fixed; z-index: 30; font-weight: 700; line-height: 1.15; color: var(--answer); background: var(--sheet); outline: 2px solid var(--answer); border-radius: 6px; padding: 2px 6px; box-shadow: 0 3px 8px rgba(0,0,0,.18); white-space: normal; overflow-wrap: anywhere; min-width: 3.5em; cursor: pointer; }
.peekpop rt { color: var(--answer); font-size: var(--rt, 13px); }
.runrow.overflow .rowend::before { content: "↓ まだ あるよ ／ "; color: var(--answer); font-weight: 700; }
.rowend { margin: 0; text-align: center; font-size: 13px; color: var(--ink-2); border-top: 1.5px solid var(--ink); padding-top: 2px; }
.burst { position: absolute; right: 10px; top: 34px; font-family: var(--round); font-weight: 900; font-size: 22px; color: var(--ink-2); opacity: 0; pointer-events: none; }
.burst.show { animation: burst 1.3s ease-out forwards; }
.burst.good { color: var(--rail); }
.burst.bad { color: var(--answer); }
@keyframes burst { 0% { opacity: 0; transform: translateY(8px) scale(.8); } 15% { opacity: 1; transform: translateY(0) scale(1.1); } 70% { opacity: 1; } 100% { opacity: 0; transform: translateY(-12px); } }
.rundock { display: grid; gap: 6px; }
.runhint { margin: 0; text-align: center; font-weight: 700; color: var(--answer); font-size: 16px; animation: nudge 1.2s ease-in-out infinite; }
@keyframes nudge { 50% { transform: translateY(4px); } }
.btn-next {
  width: 100%; min-height: 112px; font-family: var(--round); font-weight: 900; font-size: 28px;
  background: var(--rail); color: #fff; border-color: var(--rail-d); box-shadow: 0 6px 0 var(--rail-d);
  -webkit-user-select: none; user-select: none; touch-action: manipulation;
}
.btn-next.down { box-shadow: 0 2px 0 var(--rail-d); }

/* iPad 横・PC：左に行、右にタイマーとボタン */
@media (min-width: 900px) and (orientation: landscape) {
  #app.screen-run { max-width: 1280px; grid-template-columns: minmax(0, 1fr) 340px; grid-template-rows: auto minmax(0, 1fr); grid-template-areas: "row head" "row dock"; column-gap: 20px; }
  .runhead { grid-area: head; grid-template-columns: 1fr auto; grid-template-areas: "clock pause" "chip chip" "loop loop" "lap lap"; border-bottom: 0; }
  .clock span { font-size: 56px; }
  .runrow { grid-area: row; }
  .rundock { grid-area: dock; align-content: end; }
  .btn-next { min-height: 180px; font-size: 32px; }
  .lapno { font-size: 20px; }
  #app:not(.screen-run) { max-width: 960px; }
}

/* ---- おわり・けっか ---- */
.who .end { font-family: var(--round); font-weight: 900; font-size: 44px !important; color: var(--answer); }
.big, .mini dt, .mini dd, .rowtimes li > span, .lead, .daynote { word-break: keep-all; overflow-wrap: anywhere; }
.who .big, .result .big { font-family: var(--round); font-weight: 900; font-size: 34px; margin: 0; }
.who-off b, .who-prac b { font-size: 24px; }
.result { display: flex; flex-direction: column; gap: 12px; padding-top: 12px; }
.medal { display: flex; flex-direction: column; align-items: center; gap: 4px; animation: drop .7s cubic-bezier(.2, 1.6, .4, 1); }
.medal svg { width: 84px; height: 90px; }
.medal b { font-family: var(--round); font-size: 28px; color: var(--gold); }
@keyframes drop { 0% { transform: translateY(-60px) scale(.6); opacity: 0; } 100% { transform: none; opacity: 1; } }
.banner { text-align: center; font-family: var(--round); font-weight: 900; font-size: 20px; padding: 10px; border: 2px solid var(--rail); color: var(--rail); border-radius: 8px; background: var(--sheet); }
.banner.gold { border-color: var(--gold); color: var(--gold); }
.res-top { display: flex; gap: 16px; align-items: center; background: var(--sheet); border: 2px solid var(--ink); border-radius: 8px; padding: 12px; }
.stamp { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; font-weight: 700; font-size: 14px; animation: stamp .45s ease-out; }
.stamp.prac b { width: 66px; height: 66px; display: grid; place-items: center; border: 3px solid var(--rail); color: var(--rail); border-radius: 50%; font-size: 34px; transform: rotate(-8deg); }
.stamp.off span { color: var(--answer); }
.stamp.prac span { color: var(--rail); }
@keyframes stamp { 0% { transform: scale(2.2) rotate(-20deg); opacity: 0; } 70% { transform: scale(.92); opacity: 1; } 100% { transform: scale(1); } }
.label { margin: 0; font-size: 14px; color: var(--ink-2); }
.mid { margin: 0; font-family: var(--round); font-weight: 700; font-size: 20px; }
.rowtimes { list-style: none; margin: 0; padding: 0; background: var(--sheet); border: 2px solid var(--ink); border-radius: 8px; }
.rowtimes li { display: grid; grid-template-columns: auto 1fr auto; align-items: baseline; gap: 10px; padding: 8px 12px; border-top: 1px dashed var(--line); }
.rowtimes li:first-child { border-top: 0; }
.rowtimes b { font-family: var(--round); font-size: 22px; font-variant-numeric: tabular-nums; }
.rowtimes small { font-size: 13px; margin-left: 2px; }
.rowtimes em { font-style: normal; font-size: 15px; color: var(--ink-2); text-align: right; }
.rowtimes li.nb em { color: var(--gold); font-weight: 900; }

/* ---- グラフ ---- */
.chart { margin: 0; background: var(--sheet); border: 2px solid var(--ink); border-radius: 8px; padding: 10px 8px 6px; }
.chart figcaption { font-weight: 700; font-size: 15px; margin: 0 4px 4px; }
.chart svg { width: 100%; height: auto; display: block; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .ax { fill: var(--ink-2); font-size: 11px; }
.chart .val { fill: var(--ink); font-size: 11px; font-weight: 700; }
.chart .star { fill: var(--gold); font-size: 14px; }
.chart .sep { stroke: var(--answer); stroke-dasharray: 3 3; }
.chart .sept { fill: var(--answer); font-size: 9px; }
.chart .bar-off { fill: var(--rail); }
.chart .bar-prac { fill: var(--sheet); stroke: var(--rail); stroke-width: 2; stroke-dasharray: 4 3; }
.chart .hi { stroke: var(--signal); stroke-width: 3; stroke-dasharray: none; }
.chart .ln { fill: none; stroke: var(--answer); stroke-width: 2.5; }
.chart .pt-off { fill: var(--answer); }
.chart .pt-prac { fill: var(--sheet); stroke: var(--answer); stroke-width: 2; }
.legend { font-size: 13px; color: var(--ink-2); margin: 4px 4px 0; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.lg { display: inline-block; width: 14px; height: 12px; border-radius: 2px; margin-left: 6px; }
.lg.off { background: var(--rail); }
.lg.prac { border: 2px dashed var(--rail); }
.lg-star { color: var(--gold); margin-left: 6px; }
.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
.tabs button { min-height: 56px; font-family: var(--round); font-weight: 900; font-size: 19px; box-shadow: 0 3px 0 var(--ink); }
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--paper); }
.cycpick { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.cycpick button { min-height: 44px; padding: 4px 12px; border-radius: 99px; border: 1.5px solid var(--ink-2); background: transparent; font-size: 14px; }
.cycpick button.on { background: var(--ink-2); color: var(--paper); }
.graph { display: grid; gap: 14px; }
.gain { text-align: center; font-family: var(--round); font-weight: 700; font-size: 20px; margin: 0; }
.gain b { color: var(--answer); }
.empty { text-align: center; color: var(--ink-2); padding: 24px 0; margin: 0; }

/* ---- 表を見る ---- */
.tlist { list-style: none; margin: 0; padding: 0; background: var(--sheet); border: 2px solid var(--ink); border-radius: 8px; }
.tlist li { display: grid; grid-template-columns: auto auto minmax(0, 1fr) auto 56px; align-items: end; gap: 4px; padding: 6px 10px; border-top: 1px dashed var(--line); font-size: 22px; line-height: 1.2; }
.tlist li:first-child { border-top: 0; }
.tlist .q { font-weight: 700; }
.tlist .a { color: var(--answer); font-weight: 700; }
.tlist .note { display: block; font-size: 12px; color: var(--ink-2); font-weight: 400; }
.tlist rt { font-size: 12px; }
.tlist li.known { color: var(--known); }
.tlist li.known .a { color: var(--known); }
.tlist .mk { font-size: 13px; align-self: center; }
.tlist i.ok { color: var(--rail); font-style: normal; }
.say { width: 52px; height: 52px; align-self: center; border-radius: 50%; border: 2px solid var(--ink); background: var(--paper); font-size: 20px; }

/* ---- 表をえらぶ ---- */
.pick { display: grid; gap: 12px; }
.pickitem { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; min-height: 88px; padding: 12px 16px; text-align: left; }
.pickitem.on { border-color: var(--rail); box-shadow: 0 4px 0 var(--rail); background: color-mix(in srgb, var(--rail) 8%, var(--sheet)); }
.pmeta { font-size: 14px; color: var(--ink-2); }
.tabs.subj { margin-top: 10px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.tabs.subj button { min-height: 52px; font-size: 18px; padding: 4px; }

/* ---- おうちの人 ---- */
.parentp { display: grid; gap: 14px; }
.parentp section { background: var(--sheet); border: 1.5px solid var(--line); border-radius: 8px; padding: 12px 14px; display: grid; gap: 10px; }
.parentp h3 { font-size: 18px; }
.howto { margin: 0; padding-left: 1.3em; font-size: 16px; display: grid; gap: 6px; }
.small { font-size: 14px; color: var(--ink-2); margin: 0; }
.lbl { display: grid; gap: 4px; font-size: 14px; color: var(--ink-2); }
.lbl input { min-height: 52px; padding: 8px 12px; border: 2px solid var(--ink); border-radius: 8px; background: var(--paper); font-size: 18px; color: var(--ink); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 8px; }
.seg button { min-height: 56px; padding: 6px 8px; font-size: 15px; box-shadow: 0 3px 0 var(--ink); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.danger { border-color: var(--answer) !important; }

/* ---- 意見ボタン・トースト・オーバーレイ ---- */
.iken { display: flex; align-items: center; justify-content: center; min-height: 44px; margin: 0 0 8px; padding: 0 14px; border-radius: 8px; background: var(--signal); color: #1E2638; font-weight: 700; font-size: 15px; text-decoration: none; border: 2px solid #1E2638; box-shadow: 0 3px 0 #1E2638; }
#toast { position: fixed; left: 50%; bottom: 140px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; z-index: 40; max-width: min(92vw, 520px); background: var(--ink); color: var(--paper); padding: 12px 16px; border-radius: 10px; font-size: 16px; text-align: center; transition: .25s; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
#overlay { position: fixed; inset: 0; z-index: 30; display: none; place-items: center; padding: 16px; background: var(--paper); }
#overlay.show { display: grid; }
#overlay .sheet { width: min(100%, 520px); text-align: center; display: grid; gap: 12px; }
#overlay h2 { font-size: 30px; }
#overlay p { margin: 0; font-size: 18px; }
#fx { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 50; }
#print { display: none; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ---- 印刷（A4よこ・3ページ）。?print の画面プレビューも同じ ---- */
@page { size: A4 landscape; margin: 10mm; }
body.print-preview { background: #888; }
body.print-preview #app, body.print-preview #toast { display: none; }
body.print-preview #print { display: block; }
body.print-preview .page { width: 297mm; height: 210mm; padding: 10mm; box-sizing: border-box; margin: 10px auto; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.3); }
@media print {
  html, body { background: #fff !important; }
  body > *:not(#print) { display: none !important; }
  #print { display: block !important; }
  body.print-preview .page { margin: 0; box-shadow: none; width: auto; height: 190mm; padding: 0; }
}
#print { color: #111; font-family: var(--ud); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.page { height: 190mm; break-after: page; display: flex; flex-direction: column; gap: 3mm; overflow: hidden; }
.page:last-child { break-after: auto; }
.ph { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: .6mm solid #111; padding-bottom: 1.5mm; }
.pl { display: flex; align-items: baseline; gap: 4mm; }
.pbrand { font-family: var(--round); font-size: 16pt; }
.ptitle { font-family: var(--round); font-weight: 700; font-size: 14pt; }
.pkind { font-size: 11pt; border: .4mm solid #111; padding: 0 2mm; border-radius: 1mm; }
.pname { font-size: 10pt; display: flex; align-items: flex-end; gap: 2mm; }
.pname span { display: inline-block; width: 50mm; border-bottom: .3mm solid #111; height: 6mm; }
.phow { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(2, auto); gap: 1mm 5mm; font-size: 9pt; counter-reset: h; }
.phow li { counter-increment: h; }
.phow li::before { content: counter(h) " "; font-weight: 700; }
.psub { margin: 0; font-size: 10pt; }
.pgrid { width: 100%; border-collapse: collapse; table-layout: fixed; flex: 1; }
.pgrid col.rh { width: 11mm; }
.pgrid.few { flex: 0 0 auto; }
.pgrid.few td { height: 34mm; }
.pgrid.few .pq, .pgrid.few .pa { font-size: 15pt; }
.pgrid.few .pq rt, .pgrid.few .pa rt { font-size: 7.5pt; }
.pgrid th { border: .4mm solid #111; font-family: var(--round); font-size: 16pt; line-height: 1; background: #F3EBD8; }
.pgrid th small { display: block; font-size: 7pt; font-family: var(--ud); }
.pgrid td { border: .3mm solid #111; vertical-align: top; padding: 1mm 1mm .8mm; position: relative; height: 1px; }
.pgrid td.none { background: repeating-linear-gradient(-45deg, #fff 0 2mm, #eee 2mm 2.6mm); }
.pgrid td > span { display: block; text-align: center; }
.pno { position: absolute; left: .8mm; top: .4mm; font-size: 6pt; color: #888; text-align: left !important; }
.pq { font-weight: 700; font-size: 13pt; line-height: 1.75; margin-top: 2mm; }
.pa { color: #F06A3A; font-weight: 700; font-size: 13pt; line-height: 1.75; min-height: 9mm; border-top: .2mm dashed #bbb; }
.pa.blank { border-top: .2mm dashed #bbb; }
.pq rt, .pa rt { font-size: 6.5pt; }
.pgrid.long .pq, .pgrid.long .pa { font-size: 11pt; line-height: 1.6; }
.pgrid.long2 .pq, .pgrid.long2 .pa { font-size: 9.5pt; line-height: 1.55; }
.pgrid.longfew .pq, .pgrid.longfew .pa { font-size: 13pt; line-height: 1.6; }
.pgrid.longfew td { height: auto; }
.pgrid.long .pq rt, .pgrid.long .pa rt, .pgrid.long2 .pq rt, .pgrid.long2 .pa rt { font-size: 6pt; }
.pgrid.long td, .pgrid.long2 td { height: auto; }
.pgrid.long .pq, .pgrid.long2 .pq { margin-top: 1mm; }
.pmk { display: flex !important; justify-content: space-between; font-size: 6.5pt; color: #555; margin-top: .5mm; }
.pmk i { font-style: normal; }
.pfoot { margin: 1mm 0 0; font-size: 8.5pt; color: #333; }
.ptable { width: 100%; border-collapse: collapse; font-size: 9pt; }
.ptable th, .ptable td { border: .3mm solid #111; padding: .5mm 1.2mm; text-align: center; height: 8.6mm; }
.ptable thead th { background: #F3EBD8; font-size: 8.5pt; height: auto; }
.ptable tbody th { width: 17mm; font-size: 9pt; }
.ptable .date { width: 15mm; }
.ptable .pk { width: 20mm; font-size: 8pt; line-height: 1.3; }
.ptable .laps { text-align: left; }
.ptable .circ { display: inline-flex; gap: 1.2mm; margin-right: 3mm; }
.ptable .circ i { width: 4.2mm; height: 4.2mm; border: .3mm solid #111; border-radius: 50%; display: inline-block; }
.ptable .tally { display: inline-block; width: 60mm; font-size: 8pt; color: #555; }
.ptable .lt { font-size: 8.5pt; white-space: pre; }
.ptable .ta { width: 24mm; text-align: right; font-size: 8pt; }
.ptable .ten { width: 15mm; text-align: right; font-size: 8pt; }
.ptable .sign { width: 20mm; }
.pgraphs { display: grid; grid-template-columns: 1fr 1fr; gap: 6mm; flex: 1; min-height: 0; }
.pgraphs figure { margin: 0; display: flex; flex-direction: column; }
.pgraphs figcaption { font-size: 9pt; font-weight: 700; }
.pgraph { width: 100%; flex: 1 1 0; height: 0; min-height: 0; }
.pgraph line { stroke: #999; stroke-width: .35; }
.pgraph line.m { stroke: #444; stroke-width: .5; }
.pgraph line.h { stroke: #ccc; stroke-width: .3; }
.pgraph text { font-size: 7.5px; fill: #333; font-family: var(--ud); }

/* 高さの低い画面（iPhone SE・Safari のバーが出ているとき）：上を1行に、ボタンと余白を詰める（D-63） */
@media (max-height: 760px) and (orientation: portrait) {
  #app.screen-run { gap: 4px; padding-top: max(6px, env(safe-area-inset-top)); padding-bottom: max(6px, env(safe-area-inset-bottom)); }
  .runhead { grid-template-columns: auto 1fr auto auto; grid-template-areas: "clock loop lap pause"; gap: 0 8px; padding-bottom: 4px; }
  .clock small, .modechip { display: none; }
  .clock span { font-size: 28px; }
  .pause { width: 56px; height: 56px; font-size: 20px; }
  .loop li { width: 24px; height: 24px; font-size: 12px; }
  .loop li + li { margin-left: 10px; }
  .loop li + li::before { width: 10px; }
  .loop.many li { width: 20px; height: 20px; font-size: 11px; border-width: 2px; }
  .loop.many li + li { margin-left: 5px; }
  .loop.many li + li::before { width: 5px; }
  .lapno { font-size: 13px; }
  .lapno b { font-size: 20px; }
  .runrow { padding: 2px 8px 2px; }
  .rowhead h2 { font-size: 16px; }
  .rowhead h2 small, .rowclock { font-size: 12px; }
  .rowend { font-size: 12px; padding-top: 0; }
  .pairs li { padding: 1px 0; line-height: 1.08; }
  .runhint { font-size: 13px; animation: none; }
  .btn-next { min-height: 80px; font-size: 24px; box-shadow: 0 4px 0 var(--rail-d); }
}

/* ---------- 地図クイズ（D-72） ---------- */
.qhead { padding: 8px 2px 4px; }
.qno { font-size: 15px; color: var(--ink-2); margin: 0; }
.qq { font-family: var(--round); font-weight: 900; font-size: 24px; line-height: 1.5; margin: 2px 0; }
.qq rt { font-size: 11px; font-weight: 500; }
.quiz { position: relative; }
.mapwrap { position: relative; background: color-mix(in srgb, var(--rail) 6%, var(--sheet)); border: 2px solid var(--ink); border-radius: 8px; padding: 4px; }
.mapwrap.small { max-width: 360px; margin: 8px auto; }
.jmap { display: block; width: 100%; height: auto; max-height: calc(100dvh - 210px); touch-action: manipulation; }
.jmap .pf { fill: var(--sheet); stroke: var(--ink); stroke-width: 1.5; vector-effect: non-scaling-stroke; cursor: pointer; transition: fill .3s; }
/* 地方ごとに うすく 色を 分ける（D-89）。ぬった県（緑）が 上に かさなる */
.jmap .pf.r-hokkaido { fill: #E4E0F5; } .jmap .pf.r-tohoku { fill: #DCEBF8; } .jmap .pf.r-kanto { fill: #FBE3D3; }
.jmap .pf.r-chubu { fill: #FBF0C8; } .jmap .pf.r-kinki { fill: #F8DDE6; } .jmap .pf.r-chugoku { fill: #D9EEF0; }
.jmap .pf.r-shikoku { fill: #F6E6CF; } .jmap .pf.r-kyushu { fill: #EEDCF2; }
.jmap .rlbl { font: 700 40px var(--ud, sans-serif); fill: var(--ink-2); pointer-events: none; paint-order: stroke; stroke: var(--sheet); stroke-width: 6px; }
.jmap .pf.lv1 { fill: color-mix(in srgb, var(--rail) 30%, var(--sheet)); }
.jmap .pf.lv2 { fill: color-mix(in srgb, var(--rail) 60%, var(--sheet)); }
.jmap .pf.lv3 { fill: var(--rail); }
.jmap .pf.hi { fill: var(--signal); stroke-width: 2.5; animation: blink 0.8s ease-in-out 3; }
.jmap .pf.bad { fill: color-mix(in srgb, var(--answer) 35%, var(--sheet)); }
.jmap .okibox { fill: none; stroke: var(--ink-2); stroke-width: 1.2; vector-effect: non-scaling-stroke; stroke-dasharray: 4 3; }
@keyframes blink { 50% { opacity: .45; } }
.mapwrap .zoomout { position: absolute; left: 8px; top: 8px; width: auto; min-height: 44px; font-size: 16px; padding: 4px 14px; }
.qcard { position: relative; margin-top: 10px; z-index: 2; background: var(--sheet); border: 3px solid var(--ink); border-radius: 12px; padding: 12px 16px 16px; box-shadow: 0 6px 0 var(--ink); text-align: center; animation: up .25s ease-out; max-width: 560px; margin: 0 auto; }
.qcard.ok { border-color: var(--rail); box-shadow: 0 6px 0 var(--rail); }
.qcard.ng { border-color: var(--answer); box-shadow: 0 6px 0 var(--answer); }
.qcard.skip { border-color: #185FA5; box-shadow: 0 6px 0 #185FA5; }
.qcard.skip .qres { color: #185FA5; }
.qskip { display: block; margin: 10px auto 0; min-height: 48px; font-size: 16px; }
.qcard.plain { position: static; margin-top: 12px; box-shadow: none; animation: none; }
@keyframes up { from { transform: translateY(40px); opacity: 0; } }
.qres { font-family: var(--round); font-weight: 900; font-size: 22px; margin: 0; }
.qcard.ok .qres { color: var(--rail); }
.qcard.ng .qres { color: var(--answer); }
.qpref { font-family: var(--round); font-weight: 900; font-size: 26px; margin: 0; line-height: 1.5; }
.qrow { display: flex; align-items: center; gap: 12px; text-align: left; }
.qtx { flex: 1; min-width: 0; }
.qpic { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 0; font-size: 15px; font-weight: 700; }
.qpic svg { width: 112px; height: 84px; background: #FBF6EA; border-radius: 8px; border: 1.5px solid var(--line); }
.qa { font-size: 15px; color: var(--ink-2); margin: 2px 0 0; }
.qcard .btn-main { margin-top: 10px; min-height: 64px; }
.quiz.answered .jmap { max-height: 38dvh; }
.qcard.plain .qpic svg { width: 150px; height: 112px; }
.btn-quiz { background: var(--signal); color: var(--ink); }
/* 4つから えらぶ（D-90） */
.qchoices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 8px 0 12px; }
.qch { min-height: 72px; padding: 8px 10px; font-family: var(--round); font-weight: 900; font-size: 20px; line-height: 1.35; color: var(--ink);
  background: var(--sheet); border: 3px solid var(--ink); border-radius: 12px; box-shadow: 0 4px 0 var(--ink); cursor: pointer; word-break: keep-all; overflow-wrap: anywhere; }
.qch rt { font-size: 10px; font-weight: 500; }
.qch:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.qch.right { background: color-mix(in srgb, var(--rail) 22%, var(--sheet)); border-color: var(--rail); box-shadow: 0 4px 0 var(--rail); }
.qch.wrong { background: color-mix(in srgb, var(--answer) 18%, var(--sheet)); border-color: var(--answer); box-shadow: 0 4px 0 var(--answer); text-decoration: line-through; }
.qch.dim { opacity: .45; }
.qch:disabled { cursor: default; color: var(--ink); }
.qcard .mapwrap.small { max-width: 260px; margin: 8px auto 0; }
.qcard .mapwrap.small .jmap { max-height: 28dvh; }
@media (max-width: 420px) { .qch { font-size: 17px; min-height: 64px; } }
.mapbtn { margin-top: 10px; width: 100%; }
.quizend .big { margin: 4px 0; }

/* ---- 相ぼう・なかま（D-85） ---- */
.critter { width: 100%; height: 100%; display: block; }
.petcard { display: flex; align-items: center; gap: 12px; background: var(--sheet); border: 2px solid var(--ink); border-radius: 12px; padding: 10px 14px; }
.petcard.empty { flex-direction: column; text-align: center; gap: 6px; }
.petcard.empty p { margin: 0; }
.pets3 { display: flex; gap: 6px; }
.pets3 .critter { width: 64px; height: 64px; }
.petpic { width: 92px; height: 92px; flex: none; animation: bob 2.4s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-4px); } }
@media (prefers-reduced-motion: reduce) { .petpic { animation: none; } }
.petinfo { flex: 1; min-width: 0; }
.petname { margin: 0; font-family: var(--round); font-weight: 700; font-size: 20px; }

<script>
'use strict';
/* ぐるぐる音読（仮称）— 問いと答えを2回つづけて言う。1行10ペア。10分ぐるぐる回す。
   設計：docs/DESIGN.md v2 ／ 決定：DECISIONS.md */
(function () {
  const KEY = 'ondoku.v1';
  const MINUTES = [3, 5, 10];     // 1回の時間（おうちの人が選ぶ。はじめは5分。D-69）
  const OK_MISS = 'まちがえても、かんでも、止まらずに つづけて OK！';   // プライドで止めてしまう子へ（D-84）
  const OLD_MIN = 10;            // 時間を選べるようになる前の記録は10分
  const durMs = () => S.settings.minutes * 60 * 1000;
  const minOf = s => s.min || OLD_MIN;
  const partialOK = r => r.elapsed >= (r.dur || OLD_MIN * 60000) / 2 && r.rows.length > 0;   // 途中やめでも、半分以上やったら練習として残す
  let PER_ROW = 10;               // 1行=10ペア。答えが長い表は5ペア（スマホに入らないため。D-76）
  const DEBOUNCE = 600;           // 二度押しの吸収
  const FAST_MS = 1000;           // 読み量1あたりこれより速いタップは受け付けない
  const LONG_MS = 15000;          // 読み量1あたりこれより長い行は平均から外す
  const PEEK_MS = 2500;           // かくし読みで のぞける時間
  const WEAK_MAX = 3;             // にがては1行3つまで
  const DAYS = 7;                 // 1サイクル=練習した日 7日
  const REVIEW_FROM = 14, REVIEW_TO = 21;
  // 表（データ）。いま選んでいる表を DS / PAIR / ALL に入れて使う
  const DS_ORDER = Object.keys(DATASETS);   // 並びは data/index.json の順（build.py が入れる）
  const IKEN_URL = 'https://script.google.com/macros/s/AKfycbwR6PPGrKn5HL1yJ8-xc_sjV-kaEDY2dv0jD_e7XyRSjQUd2E_2_Pq-rGE6tWxHRj3QFg/exec';
  let DS, PAIR, ALL;
  // 学年：おうちの人が選ぶ学年までに習う中身だけを出す（1ペアごとの g。D-83）
  let GRADE = 3;
  const shown = p => (p.g || 3) <= GRADE;
  const visibleDs = () => DS_ORDER.filter(id => DATASETS[id].pairs.some(shown));
  function useDs(id) {
    const vis = visibleDs();
    DS = DATASETS[vis.includes(id) ? id : vis[0] || DS_ORDER[0]];
    PAIR = {}; DS.pairs.forEach(p => { PAIR[p.code] = p; });
    ALL = DS.pairs.filter(shown).map(p => p.code);
    PER_ROW = DS.per_row || 10;
  }
  useDs(DS_ORDER[0]);

  const app = document.getElementById('app');
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  /* ---------- 保存 ---------- */
  function fresh() {
    return {
      version: 1,
      settings: { level: 'kids', tokyo: 'tokyo', sound: true, reward: '', rewardDays: 5, seenIntro: false, seenRunHint: false, seenPeekHint: false, ds: '', iken: false, minutes: 5, grade: 6 },
      cycles: [], sessions: [], rewardShown: [], inProgress: null, map: {}, quizLog: [], pet: null, mons: [], bossWins: []
    };
  }
  function normalize(s) {
    const f = fresh();
    s.settings = Object.assign(f.settings, s.settings || {});
    if (!MINUTES.includes(s.settings.minutes)) s.settings.minutes = 5;
    if (![3, 4, 5, 6].includes(s.settings.grade)) s.settings.grade = 6;   // 基準が決まるまでは絞らない（D-84）
    s.cycles = s.cycles || []; s.sessions = s.sessions || []; s.rewardShown = s.rewardShown || []; s.map = s.map || {}; s.quizLog = s.quizLog || []; s.mons = s.mons || []; s.bossWins = s.bossWins || []; if (s.pet && !['hinoko', 'shizuku', 'mebuki'].includes(s.pet.kind)) s.pet = null;
    s.cycles.forEach(c => { c.marks = c.marks || {}; c.notYet = c.notYet || []; });
    if (s.inProgress && !s.cycles.some(c => c.id === s.inProgress.cycleId)) s.inProgress = null;
    return s;
  }
  function load() {
    try {
      const s = JSON.parse(localStorage.getItem(KEY));
      if (s && s.version === 1) return normalize(s);
    } catch (e) { /* こわれていたら新しく */ }
    return fresh();
  }
  let S = load();

    const mon = { sp: Math.floor(Math.random() * MONS.length), star, pow: star * 20 + Math.floor(Math.random() * (star === 5 ? 50 : 20)), day: today() };
    S.mons.push(mon); save();
    return { mon };
  }
  function monCard(m) {
    const d = MONS[m.sp];
    return `<div class="moncard ${m.star >= 5 ? 'super' : ''}">${critter(d)}<p class="mn">${d.name}</p><p class="ms">${stars(m.star)}</p><p class="mp">強さ <b>${m.pow}</b></p></div>`;
  }

  /* ---------- 画面 ---------- */
  const SCREENS = {};

  /* ---------- ボス（D-87） ---------- */
  // 表を 7日 クリアするたびに 1回 ちょうせんできる。相ぼう（レベル×10）＋強い なかま3びきの 強さの 合計で たおす。
  // 負けても 何も なくならない。音読して なかまを ふやせば 次は 勝てる
  const BOSSES = [
    { name: 'ネムネム', body: '#AFA9EC', dark: '#3C3489', top: 'moon', art: 'boss_1' },
    { name: 'ダラダラン', body: '#B9C7A6', dark: '#4F5E3A', top: 'cloud', art: 'boss_2' },
    { name: 'ワスレン', body: '#8A95C0', dark: '#1E2A55', top: 'horn', art: 'boss_3' },
    { name: 'モヤモヤ大王', body: '#B4B2A9', dark: '#444441', top: 'star', art: 'boss_4' }
  ];
  const petPow = () => S.pet ? (playDays().length + 1) * 10 : 0;
  const teamMons = () => [...S.mons].sort((a, b) => b.pow - a.pow).slice(0, 3);
  const teamPow = () => petPow() + teamMons().reduce((a, m) => a + m.pow, 0);
  const bossNo = () => S.bossWins.length;
  const bossOf = k => Object.assign({}, BOSSES[k % BOSSES.length], { k, hp: 150 + 120 * k, up: k >= BOSSES.length });
  const bossOpen = () => !!S.pet && clearedCount() > bossNo();
  function bossCard() {
    if (!S.pet) return '';
    const b = bossOf(bossNo()), tp = teamPow(), open = bossOpen();
    return `<section class="bosscard ${open ? 'open' : ''}"><div class="bosspic">${critter(b)}</div>
      <div class="bossinfo"><p class="bt">${open ? 'ボスが あらわれた！' : '次の ボス'}</p>

      <p class="bteam">チームの 強さ <b>${tp}</b>${tp >= b.hp ? '　勝てそう！' : `　あと ${b.hp - tp}`}</p>
      ${open ? btn('boss', '⚔ ちょうせん！', 'btn-main') : '<p class="bnote">表を 7日 クリアすると ちょうせん できるよ</p>'}</div></section>`;
  }
  function startBoss() {
    if (!bossOpen()) return go('home');
    const p = PETS[S.pet.kind];
    const team = [{ pic: critter(p, petStage()), name: p.name, pow: petPow() },
      ...teamMons().map(m => ({ pic: critter(MONS[m.sp]), name: MONS[m.sp].name, pow: m.pow }))];
    ui.bt = { k: bossNo(), team, step: 0, saved: false };
    go('boss');
    const tick = () => {
      if (ui.screen !== 'boss' || !ui.bt) return;
      const z = ui.bt;
      if (z.step >= z.team.length) return;
      z.step++; SND.lap(); render();
      if (z.step < z.team.length) setTimeout(tick, 900);
      else setTimeout(() => { if (ui.screen === 'boss') { z.end = true; finishBoss(); } }, 700);
    };
    setTimeout(tick, 1000);
  }
  function finishBoss() {
    const z = ui.bt, b = bossOf(z.k), dmg = z.team.reduce((a, t) => a + t.pow, 0);

  /* ---------- 音読（3・5・10分） ---------- */
  let R = null;
  function el() { return R.elapsed + (R.since ? Date.now() - R.since : 0); }
  function clock(ms) { ms = Math.max(0, ms); const s = Math.ceil(ms / 1000); return `${Math.floor(s / 60)}:${pad(s % 60)}`; }
  function persistRun() {
    if (!R) return;
    S.inProgress = Object.assign({}, R, { elapsed: el(), since: null, peeks: R.peeks.slice(), curPeeks: R.curPeeks.slice(), rows: R.rows.slice() });

  SCREENS.countdown = function () {

  SCREENS.run = function () {
    const c = cycleById(R.cycleId);
    const ri = R.act[R.rowPos], info = rowInfo(c, ri);
    R.ghost = ghostMs(rowKey(R.mode, info));
    const lap = Math.floor(R.rows.length / R.act.length) + 1;
    const hide = R.mode === 'hide';
    const known = info.codes.filter(k => mark(c, k) === 'known').length;
    const lines = info.codes.filter(k => mark(c, k) !== 'known').map(k => {

      return `<li class="${w ? 'weak' : ''}">

        ${hide ? `<button type="button" class="a cover" data-act="peek" data-code="${k}" aria-label="のぞく">${rb(ans(p))}</button>` : `<span class="a">${rb(ans(p))}</span>`}
        <span class="times">${w ? '×4<i>★</i>' : '×2'}</span></li>`;
    }).join('');
    const stations = R.act.map((r, i) => `<li class="${i < R.rowPos ? 'done' : ''} ${i === R.rowPos ? 'here' : ''}">${r + 1}</li>`).join('');
    let hint = '';
    if (!S.settings.seenRunHint) hint = '<p class="runhint">1行 言えたら ↓を おす</p>';
    else if (hide && !S.settings.seenPeekHint) hint = '<p class="runhint">出ないときは ？に タッチして 見る</p>';
    return `
      <section class="runhead">
        <div class="clock"><small>のこり</small><span id="clock">${clock(R.dur - el())}</span></div>
        <div class="modechip ${hide ? 'hide' : ''}">${hide ? 'かくして' : '見ながら'}</div>
        <button type="button" class="pause" data-act="pause" aria-label="一時ていし"><span>Ⅱ</span></button>
        <ol class="loop ${R.act.length > 5 ? 'many' : ''}" aria-label="${lap}しゅうめ">${stations}</ol>
        <p class="lapno" id="lapno"><b>${lap}</b>しゅうめ</p>
      </section>
      <section class="runrow" id="runrow">

  // 1行が画面に入るように文字の大きさを決める
  function fitRun() {
    const box = document.getElementById('runrow'), list = document.getElementById('pairs');

    const n = Math.max(list.children.length, 4);
    const maxC = +(list.dataset.maxc || 8), maxS = +(list.dataset.maxs || 5);
    const stack = maxC > 12;   // 長い答え（三大〇〇など）は 問い／答え を2段に。かくして も同じ（のぞいたとき答えが全部見えるように。幅も答えの長さで見積もる）
    list.classList.toggle('stack', stack);
    box.style.setProperty('--fs', '20px');
    const gh = box.querySelector('.ghost');
    const head = box.querySelector('.rowhead').offsetHeight + box.querySelector('.rowend').offsetHeight + (gh ? gh.offsetHeight : 0) + 16;
    const availH = box.clientHeight - head;
    const availW = list.clientWidth;
    const byH = stack ? (availH / n - 10) / 2.9 : (availH / n - 6) / 1.62;
    const byW = (availW - 16) / ((stack ? maxS : maxC) + 3.6);
    let fs = Math.max(20, Math.min(44, byH, byW));
    const set = v => { box.style.setProperty('--fs', v.toFixed(1) + 'px'); box.style.setProperty('--rt', Math.max(13, v * 0.44).toFixed(1) + 'px'); };
    set(fs);

    const wide = () => [...list.children].some(li => li.scrollWidth > li.clientWidth + 1);   // ふりがなが長いと漢字より広くなるので実測
    while ((list.scrollHeight > list.clientHeight + 1 || wide()) && fs > 16) { fs -= 1; set(fs); }

    const tip = document.querySelector('.runhint');

  const rbText = t => esc(t).replace(/([一-龯々]+)\{([ぁ-ゖー]+)\}/g, '<ruby>$1<rt>$2</rt></ruby>');
  function quizQuestion(p) {

  function mapSVG(opts = {}) {   // opts.hi: 光らせる県, opts.bad: まちがえた県

    Object.keys(M.prefs).forEach(c => {
      const lv = level(S.map[c] || 0);
      g += `<path data-c="${c}" class="pf r-${M.prefs[c].r} lv${lv} ${[].concat(opts.hi || []).includes(c) ? 'hi' : ''} ${opts.bad === c ? 'bad' : ''}" d="${M.prefs[c].d}"/>`;

  // えらぶ答え：同じ表の ほかの答えから、長さの近いもの（ことばの なかまが そろう）を 3つまで。D-90
  function quizChoices(p) {
    const right = ansText(p), L = right.length, seen = new Set([right]), cand = [];
    quizPairs().concat(DS.pairs).forEach(x => { const t = ansText(x); if (!seen.has(t)) { seen.add(t); cand.push(x); } });
    const near = cand.filter(x => Math.abs(ansText(x).length - L) <= Math.max(3, Math.round(L * 0.6)));

    for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
    const cs = [p, ...pool.slice(0, 3)];

  };
  function quizPick(i) {

  function lapGraph(nRows) {     // 行数に合わせた周回の目盛り（1行なら0〜24、5行なら0〜6を0.2きざみ）
    if (nRows <= 1) return printGraph(12, 2, v => v * 2);
    if (nRows === 2) return printGraph(12, 2, v => v);
    if (nRows === 3) return printGraph(10, 2, v => v);
    return printGraph(6, nRows, v => v);
  }
  function printGraph(steps, sub, lab) {   // 横8（7日＋ふくしゅう）× 縦steps（subきざみの補助線）
    const cw = 30, ch = 13, L = 24, T = 6, W = L + cw * 8 + 4, H = T + ch * steps + 16;
    let s = '';
    for (let r = 0; r <= steps * sub; r++) { const yy = T + r * ch / sub; s += `<line x1="${L}" x2="${L + cw * 8}" y1="${yy}" y2="${yy}" class="${r % sub ? 'h' : 'm'}"/>`; }
    for (let c = 0; c <= 8; c++) s += `<line x1="${L + c * cw}" x2="${L + c * cw}" y1="${T}" y2="${T + ch * steps}" class="m"/>`;
    for (let v = 0; v <= steps; v++) s += `<text x="${L - 4}" y="${T + (steps - v) * ch + 3}" text-anchor="end">${lab(v)}</text>`;
    for (let i = 0; i < 8; i++) s += `<text x="${L + i * cw + cw / 2}" y="${T + ch * steps + 12}" text-anchor="middle">${i < 7 ? (i + 1) + '日め' : 'ふく習'}</text>`;
    return `<svg viewBox="0 0 ${W} ${H}" class="pgraph">${s}</svg>`;
  }
  function renderPrint() { document.getElementById('print').innerHTML = printHTML(); }

  /* ---------- 演出 ---------- */
  const fx = document.getElementById('fx');
  function fxSize() { fx.width = innerWidth * devicePixelRatio; fx.height = innerHeight * devicePixelRatio; }
  let parts = [], fxRun = false;
  const COLORS = ['#F2B705', '#D9481F', '#2F6B4F', '#C99A1E', '#1E2638'];
  const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
  function confetti() {
    if (reduced()) return;
    fxSize();
    for (let i = 0; i < 150; i++) parts.push({ x: innerWidth / 2 + (Math.random() - .5) * 100, y: innerHeight * .32, vx: (Math.random() - .5) * 14, vy: -Math.random() * 13 - 4, r: Math.random() * 6.28, vr: (Math.random() - .5) * .4, w: 6 + Math.random() * 6, h: 4 + Math.random() * 9, c: COLORS[i % 5], life: 170 });
    loopFx();
  }
  function sparks(n) {
    const b = document.getElementById('next');
    if (!b || reduced()) return;
    fxSize();
    const r = b.getBoundingClientRect();
    for (let i = 0; i < n; i++) parts.push({ x: r.left + r.width / 2, y: r.top + 8, vx: (Math.random() - .5) * 10, vy: -Math.random() * 10 - 3, r: 0, vr: .2, w: 6, h: 6, c: COLORS[i % 3], life: 55 });
    loopFx();
  }
  function loopFx() {
    if (fxRun) return;
    fxRun = true;
    const ctx = fx.getContext('2d');
    (function step() {
      ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      parts = parts.filter(p => p.life-- > 0 && p.y < innerHeight + 20);
      parts.forEach(p => {
        p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
      });
      if (parts.length) requestAnimationFrame(step); else { ctx.clearRect(0, 0, innerWidth, innerHeight); fxRun = false; }
    })();
  }

  function openPeek(b, p) {
    b.classList.add('peek');
    const li = b.closest('li'), r = b.getBoundingClientRect(), L = li.getBoundingClientRect();
    const pop = document.createElement('div');
    pop.className = 'peekpop'; pop.innerHTML = rb(ans(p));

    pop.style.fontSize = rs.getPropertyValue('--fs'); pop.style.setProperty('--rt', rs.getPropertyValue('--rt'));
    pop.style.left = r.left + 'px'; pop.style.top = r.top + 'px';
    pop.style.maxWidth = Math.max(L.right - r.left, r.width) + 'px';
    pop.addEventListener('click', () => closePeek(b));
    document.body.appendChild(pop);
    const h = pop.getBoundingClientRect();
    if (h.bottom > innerHeight - 4) pop.style.top = Math.max(4, innerHeight - 4 - h.height) + 'px';
    b._pop = pop;
  }

    h.classList.add('holding');
    holdT = setTimeout(() => { holdFired = true; h.classList.remove('holding'); go('parent'); }, 2000);
  });
  ['pointerup', 'pointercancel'].forEach(t => app.addEventListener(t, () => { clearTimeout(holdT); document.querySelectorAll('.holding').forEach(x => x.classList.remove('holding')); }));
  app.addEventListener('pointerout', e => { if (e.target.closest && e.target.closest('[data-hold]')) { clearTimeout(holdT); document.querySelectorAll('.holding').forEach(x => x.classList.remove('holding')); } });
  app.addEventListener('click', e => { if (e.target.closest('[data-hold]') && !holdFired) toast('ここは おうちの人の ページ。おうちの人に おねがいしてね'); });
  app.addEventListener('contextmenu', e => { if (e.target.closest('[data-hold]')) e.preventDefault(); });

  window.addEventListener('beforeprint', renderPrint);
  window.addEventListener('resize', () => { if (fxRun) fxSize(); });

  // Service Worker（URLで配るときだけ。ondoku.html 単体では登録しない）
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && !/ondoku\.html$/.test(location.pathname) && !location.search.includes('nosw')) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => { }));
  }

  const params = new URLSearchParams(location.search);
  if (params.has('iken')) { S.settings.iken = params.get('iken') !== '0'; save(); }
  if (params.has('print')) {   // ?print で印刷用ページを画面に出す（PDF作成・プレビュー用）
    if (params.get('ds') && DATASETS[params.get('ds')]) useDs(params.get('ds'));
    if (params.get('tokyo') === 'shinjuku') S.settings.tokyo = 'shinjuku';
    document.body.classList.add('print-preview'); renderPrint();
  } else render();

  // テスト用（Playwright から使う）
  window.__ondoku = { get state() { return S; }, get run() { return R; }, ui, durMs, render, fitRun, quizRight: () => ui.qz.qs[ui.qz.i].ch.indexOf(ui.qz.qs[ui.qz.i].code) };
})();

</script>
</body>
</html>
